<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2d"/>
      <stop offset="100%" stop-color="#0f0f18"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e2ec"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Card graphic -->
  <rect x="116" y="76" width="280" height="360" rx="24" fill="url(#cardBg)" filter="url(#shadow)" stroke="#4a4a60" stroke-width="4"/>

  <!-- Card Suit Spade -->
  <text x="256" y="295" font-family="sans-serif" font-size="190" text-anchor="middle" fill="#1a1a24">♠</text>

  <!-- Top-left corner rank & suit -->
  <text x="144" y="132" font-family="sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="#1a1a24">A</text>
  <text x="144" y="168" font-family="sans-serif" font-size="32" text-anchor="middle" fill="#1a1a24">♠</text>

  <!-- Bottom-right corner rank & suit -->
  <g transform="rotate(180 368 380)">
    <text x="368" y="380" font-family="sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="#1a1a24">A</text>
    <text x="368" y="416" font-family="sans-serif" font-size="32" text-anchor="middle" fill="#1a1a24">♠</text>
  </g>
</svg>
